# Mimir local config for docker-compose development
# Single-process mode, filesystem backend, multi-tenancy enabled.

target: all

multitenancy_enabled: true

server:
  http_listen_port: 8080
  grpc_listen_port: 9095

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  tsdb:
    dir: /data/mimir/tsdb

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/rules

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/alertmanager

ingester:
  ring:
    replication_factor: 1

compactor:
  data_dir: /data/mimir/compactor

limits:
  ingestion_rate: 10000
  ingestion_burst_size: 20000
  max_global_series_per_user: 100000
